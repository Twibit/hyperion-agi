[package]
name = "telekinesis"
version = "0.1.0"
edition = "2021"
authors = ["Telekinesis Project"]
description = "Biologically-grounded telekinetic data-manipulation limb for AI agents, with hybrid ripgrep-class file search."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://example.invalid/telekinesis"
keywords = ["ai", "agent", "filesystem", "search", "actor"]
categories = ["filesystem", "concurrency", "asynchronous"]

[lib]
name = "telekinesis"
path = "src/lib.rs"

[[bin]]
name = "tk"
path = "src/bin/tk.rs"

[dependencies]
# Async runtime — the "spinal cord"
tokio = { version = "1.38", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"

# File search "eye" — ripgrep-class
ignore = "0.4"           # gitignore-aware parallel walker (backs ripgrep)
grep-searcher = "0.1"    # ripgrep's line searcher
grep-regex = "0.1"       # ripgrep's regex engine
grep-matcher = "0.1"
walkdir = "2.5"
memmap2 = "0.9"

# Ranking / scoring
rayon = "1.10"
ahash = "0.8"
smallvec = "1.13"
regex = "1.10"

# Error handling & tracing (the "mirror neurons")
thiserror = "1.0"
anyhow = "1.0.86"
reqwest = { version = "0.12.28", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Serialization for message-passing between actors
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# LRU-bounded efference-copy buffer (prevents unbounded growth)
lru = "0.12"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Time / IDs
uuid = { version = "1.10", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.38", features = ["full", "test-util"] }
tempfile = "3.10"
proptest = "1.5"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.bench]
inherits = "release"
debug = true
