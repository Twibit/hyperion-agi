[package]
name = "neurorust"
version = "0.1.0"
edition = "2021"
authors = ["neurorust contributors"]
description = "Biologically accurate human neuron simulation in Rust with hybrid memory compression and Julia FFI for numerical kernels"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://example.org/neurorust"
keywords = ["neuroscience", "simulation", "hodgkin-huxley", "izhikevich", "compression"]
categories = ["science", "simulation"]

[lib]
name = "neurorust"
path = "src/lib.rs"

[[bin]]
name = "neurorust-demo"
path = "src/bin/demo.rs"

[[bin]]
name = "neurorust-bench"
path = "src/bin/bench.rs"

[[bin]]
name = "neurorust-bench-avx2"
path = "src/bin/bench_avx2.rs"

[[bin]]
name = "neurorust-bench-v33"
path = "src/bin/bench_v33.rs"

[dependencies]
# Numerics
nalgebra = "0.33"
ndarray = "0.16"
num-traits = "0.2"

# Compression
zstd = "0.13"

# Serialization / bit ops
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
bitvec = { version = "1", features = ["serde"] }

# Utility
thiserror = "1"
rand = "0.8"
rand_distr = "0.4"
log = "0.4"
env_logger = "0.11"

# Optional Julia FFI (gated behind the `julia` feature to keep the crate
# buildable on machines without a Julia install).
jlrs = { version = "0.20", optional = true }

[features]
default = []
julia = ["dep:jlrs"]

[dev-dependencies]
approx = "0.5"
criterion = { version = "0.5", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
